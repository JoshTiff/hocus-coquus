<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Search')}"></head>
    <body>
        <header th:replace="~{fragments/layout :: site-header}"></header>

        <main class="panel">
            <h4 class="panel-title">Edit Recipe</h4>
            <img th:src="@{/images/recipes/recipe-1.png}" alt="" width="20%vh" style="margin:auto" />
            <div class="recipe-edit-field">
                Recipe Name
                <label for="recipeName"></label>
                <textarea id="recipeName" name="recipeName">Name of Recipe One</textarea>
            </div>
            <div class="recipe-edit-field">
                Recipe Description
                <label for="recipeDescription"></label>
                <textarea id="recipeDescription" name="recipeDescription">Description For Recipe One</textarea>
            </div>
            <div class="recipe-edit-field">
                Recipe Servings
                <br>
                <label for="recipeServings"></label>
                <input type="number" id="recipeServings" name="recipeServings" min="1">
            </div>
            <div class="recipe-edit-field">
                Recipe Ingredients
                <label for="recipeIngredients"></label>
                <textarea id="recipeIngredients" name="recipeIngredients">Ingredient 1
Ingredient 2
Ingredient 3</textarea>
            </div>

            <div class="recipe-edit-field">
                Recipe Instructions
                <label for="recipeInstructions"></label>
                <textarea id="recipeInstructions" name="recipeInstructions">Step 1
Step 2
Step 3</textarea>
            </div>

            <div class="recipe-edit-field">
                Recipe Image
                <br>
                <input type="file" id="fileInput" name="file"
                       accept="image/png,image/jpeg,image/webp" required>
            </div>

            <button class="btn" style="width: 15rem; margin: auto">Update Recipe</button>

        </main>

    </body>
</html>
