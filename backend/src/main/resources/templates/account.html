<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Account')}"></head>
    <body>
        <header th:replace="~{fragments/layout :: site-header}"></header>

        <div class="account-layout">
            <aside
                th:replace="~{fragments/layout :: sidebar('account')}"
            ></aside>

            <main class="panel">
                <h2 class="panel-title">Account Info</h2>

                <form class="account-form" onsubmit="return false;">
                    <label for="name">Name</label>
                    <input id="name" type="text" value="John Doe" />

                    <label for="email">Email</label>
                    <input id="email" type="email" value="email@email.com" />

                    <label for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        value="passwordplaceholder"
                    />

                    <button class="btn">Submit</button>
                </form>
            </main>
        </div>
    </body>
</html>
