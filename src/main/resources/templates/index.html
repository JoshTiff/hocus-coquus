<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hocus Coquus</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Italianno&family=Tangerine:wght@700&family=Pinyon+Script&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete"
        />
        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    <body>
        <header>
            <a href="/" class="logo">Hocus Coquus</a>
            <nav>
                <a href="/" class="link">Home</a>
                <a href="#" class="link">Browse Recipes</a>
                <a href="#" class="btn">Log In</a>
                <a href="#" class="btn">Sign Up</a>
            </nav>
        </header>

        <main>
            <h1>What’s Cooking?</h1>

            <img class="spiderweb" src="/images/spiderweb.png" />
            <img class="spiderweb-2" src="/images/spiderweb.png" />

            <div class="search">
                <input
                    type="text"
                    placeholder="Start typing to add ingredients"
                />
            </div>

            <section class="cauldron">
                <h2>My Cauldron</h2>
                <ul>
                    <li>
                        Parsley
                        <button class="icon">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </li>
                    <li>
                        Sage
                        <button class="icon">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </li>
                    <li>
                        Rosemary
                        <button class="icon">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </li>
                    <li>
                        Thyme
                        <button class="icon">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </li>
                </ul>
            </section>

            <button class="btn brew">Brew Recipes</button>
        </main>
    </body>
</html>
