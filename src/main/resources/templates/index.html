<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hocus Coquus</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Italianno&family=Tangerine:wght@700&family=Pinyon+Script&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete"
        />
        <link rel="stylesheet" href="/css/styles.css" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <header>
            <a href="/" class="logo">Hocus Coquus</a>
            <nav>
                <!-- Show the following buttons to only authenticated users. -->
                <div sec:authorize="!isAuthenticated()">
                    <a href="/" class="link">Home</a>
                    <a href="#" class="link">Browse Recipes</a>
                    <a th:href="@{/login}" class="btn">Log In</a>
                    <a th:href="@{/signup}" class="btn">Sign Up</a>
                </div>
                <div sec:authorize="isAuthenticated()">
                    <a href="/" class="link">Home</a>
                    <a href="#" class="link">Browse Recipes</a>
                    <a th:href="@{/edit/recipe}" class="link">My Recipes</a>
                    <a th:href="@{/calendar}" class="link">Calendar</a>
                    <a th:href="@{/account}" class="link">Account</a>
                    <form action="#" th:action="@{/logout}" method="post">
                        <input type="submit" class="btn" value="Logout"/>
                    </form>
                </div>
            </nav>
        </header>

        <main>
            <h1 class="welcome" sec:authorize="isAuthenticated()">
                Welcome, <span th:text="${#authentication.principal.firstName}"></span>!
            </h1>
            
            <h1>What’s Cooking?</h1>

            <img class="spiderweb" src="/images/spiderweb.png" />
            <img class="spiderweb-2" src="/images/spiderweb.png" />

            <div class="search">
                <input
                    type="text"
                    placeholder="Start typing to add ingredients"
                />
            </div>

            <section class="cauldron">
                <h2>My Cauldron</h2>
                <ul>
                    <li>
                        Parsley
                        <button class="icon">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </li>
                    <li>
                        Sage
                        <button class="icon">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </li>
                    <li>
                        Rosemary
                        <button class="icon">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </li>
                    <li>
                        Thyme
                        <button class="icon">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </li>
                </ul>
            </section>

            <button class="btn brew">Brew Recipes</button>
        </main>
    </body>
</html>
