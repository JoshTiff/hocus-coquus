<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:replace="~{fragments/layout :: head('Edit Recipe')}"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        <header th:replace="~{fragments/layout :: site-header}"></header>

        <main class="panel">
            <div class="container" th:if="${recipe == null}">
                <h4 class="panel-title">My Recipes</h4>
                <p th:if="${#lists.isEmpty(recipes)}">You have no uploaded recipes to edit.</p>
                <ul th:unless="${#lists.isEmpty(recipes)}">
                    <li th:each="item : ${recipes}">
                        <a class="link" th:href="@{/edit/recipe(id=${item.recipeId})}"
                           th:text="${item.recipeName}">Recipe name</a>
                    </li>
                </ul>
            </div>

            <div class="container" id="editRecipeContainer" th:if="${recipe != null}">
                <h4 class="panel-title">Edit Recipe</h4>
                <a class="link" th:href="@{/edit/recipe}">Back to My Recipes</a>
                <p th:if="${saved}" role="status">Recipe saved.</p>
                <img th:src="${#strings.isEmpty(recipe.image)} ? @{/images/recipes/recipe-1.png} : ${recipe.image}"
                     alt="" style="width: 20%; margin: auto" />

                <form class="mb-5" method="post" th:action="@{/edit/recipe}">
                    <input type="hidden" name="id" th:value="${recipe.recipeId}">
                    <label for="recipeName" class="form-label">Recipe Name</label>
                    <input type="text" class="form-control mb-3" id="recipeName" name="recipeName" th:value="${recipe.recipeName}" required maxlength="255">

                    <div class="form-field">
                        <label for="recipeDescription" class="form-label">Recipe Description</label>
                        <textarea class="form-control mb-3" id="recipeDescription" name="recipeDescription" rows="4" maxlength="255"
                                  th:text="${recipe.recipeDescription}"></textarea>
                    </div>

                    <div class="form-field">
                        <label for="recipeImage" class="form-label">Image URL</label>
                        <input type="text" class="form-control mb-3" id="recipeImage" name="image"
                               th:value="${recipe.image}" maxlength="255">
                    </div>

                    <div class="form-field my-1">
                        <label for="recipeInstructions" class="form-label">Recipe Instructions</label>
                        <textarea class="form-control" id="recipeInstructions" name="instructions" rows="4" maxlength="255"
                                  th:text="${recipe.instructions}"></textarea>
                    </div>
                    <button class="btn" type="submit" style="width: 15rem; margin: auto; display: flex">
                        Update Recipe
                    </button>
                </form>
            </div>
        </main>

    </body>
</html>
