<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(${recipeId == null ? 'My Recipes' : 'Edit Recipe'})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: site-header}"></header>

        <main class="panel">
            <section th:if="${recipeId == null}">
                <h1 class="panel-title">My Recipes</h1>
                <p th:if="${#lists.isEmpty(recipes)}">You have no uploaded recipes to edit.</p>
                <ul th:unless="${#lists.isEmpty(recipes)}">
                    <li th:each="recipe : ${recipes}">
                        <span th:text="${recipe.recipeName}"></span>
                        <a class="link" th:href="@{/edit/recipe(id=${recipe.recipeId})}"
                           th:aria-label="|Edit ${recipe.recipeName}|">Edit</a>
                    </li>
                </ul>
            </section>

            <section th:if="${recipeId != null}">
                <h1 class="panel-title">Edit Recipe</h1>
                <a class="link" th:href="@{/edit/recipe}">Back to My Recipes</a>
                <p id="recipe-status" role="status">Loading recipe…</p>
                <form id="recipe-form" hidden
                      th:data-recipe-url="@{/api/recipe/{id}(id=${recipeId})}">
                    <fieldset id="recipe-fields">
                        <div class="form-field">
                            <label for="recipeName">Recipe Name</label>
                            <input id="recipeName" name="recipeName" required maxlength="255">
                        </div>
                        <div class="form-field">
                            <label for="recipeDescription">Description</label>
                            <textarea id="recipeDescription" name="recipeDescription" rows="4" maxlength="255"></textarea>
                        </div>
                        <div class="form-field">
                            <label for="numberServings">Number of Servings</label>
                            <input id="numberServings" name="numberServings" type="number" min="1" max="2147483647">
                        </div>
                        <div class="form-field">
                            <label for="image">Image URL or Path</label>
                            <input id="image" name="image" maxlength="255">
                        </div>
                        <div class="form-field">
                            <label for="instructions">Instructions</label>
                            <textarea id="instructions" name="instructions" rows="4" maxlength="255"></textarea>
                        </div>
                        <fieldset>
                            <legend>Ingredients</legend>
                            <div id="recipe-ingredients"></div>
                            <button class="btn" id="add-ingredient" type="button">Add Ingredient</button>
                        </fieldset>
                        <button class="btn" type="submit">Save Changes</button>
                    </fieldset>
                </form>
                <template id="ingredient-row">
                    <div class="form-field">
                        <label>Ingredient <input name="ingredient" required maxlength="255"></label>
                        <label>Quantity <input name="quantity" type="number" min="0" step="any" required></label>
                        <label>Unit <input name="measurement" maxlength="255"></label>
                        <button class="btn" type="button">Remove Ingredient</button>
                    </div>
                </template>
                <script defer th:src="@{/js/edit-recipe.js}"></script>
            </section>
        </main>
    </body>
</html>
